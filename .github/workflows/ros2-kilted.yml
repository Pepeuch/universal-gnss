name: ROS 2 validation

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distribution: kilted
            container_image: ubuntu:noble
          - ros_distribution: lyrical
            container_image: ubuntu:resolute
    container:
      image: ${{ matrix.container_image }}
    env:
      ROS_LOCALHOST_ONLY: "1"
      ROS_LOG_DIR: /tmp/universal_gnss_ros_log

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 ${{ matrix.ros_distribution }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}

      - name: Build and test universal_gnss_ros2
        run: |
          source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
          mkdir -p "$ROS_LOG_DIR"
          mkdir -p "$GITHUB_WORKSPACE/ros2_ws/src"
          ln -s "$GITHUB_WORKSPACE/gnss_ros2" "$GITHUB_WORKSPACE/ros2_ws/src/gnss_ros2"
          ln -s "$GITHUB_WORKSPACE/gnss_core" "$GITHUB_WORKSPACE/ros2_ws/src/gnss_core"
          cd "$GITHUB_WORKSPACE/ros2_ws"
          colcon build --packages-select universal_gnss_ros2
          colcon test --packages-select universal_gnss_ros2
          colcon test-result --verbose
