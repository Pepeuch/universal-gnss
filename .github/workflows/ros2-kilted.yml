name: ROS 2 Kilted validation

on:
  push:
  pull_request:

jobs:
  kilted-build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    env:
      ROS_LOCALHOST_ONLY: "1"
      ROS_LOG_DIR: /tmp/universal_gnss_ros_log_kilted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Kilted
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: kilted

      - name: Prepare normal project build user
        run: |
          groupadd --gid 1001 universal-gnss-ci
          useradd --create-home --uid 1001 --gid 1001 universal-gnss-ci
          install --directory --owner=1001 --group=1001 "$ROS_LOG_DIR"
          chown -R 1001:1001 "$GITHUB_WORKSPACE"

      - name: Build and test universal_gnss_ros2 on Kilted
        shell: bash
        run: |
          runuser -u universal-gnss-ci -- env \
            HOME=/home/universal-gnss-ci \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            ROS_LOG_DIR="$ROS_LOG_DIR" \
            bash -lc '
              set -eo pipefail
              source /opt/ros/kilted/setup.bash
              mkdir -p "$GITHUB_WORKSPACE/ros2_ws_kilted/src"
              ln -s "$GITHUB_WORKSPACE/gnss_ros2" "$GITHUB_WORKSPACE/ros2_ws_kilted/src/gnss_ros2"
              ln -s "$GITHUB_WORKSPACE/gnss_core" "$GITHUB_WORKSPACE/ros2_ws_kilted/src/gnss_core"
              cd "$GITHUB_WORKSPACE/ros2_ws_kilted"
              colcon build --packages-select universal_gnss_ros2
              if ! colcon test --packages-select universal_gnss_ros2; then
                colcon test-result --verbose
                exit 1
              fi
              colcon test-result --verbose
            '
