name: ROS 2 Lyrical validation

on:
  push:
  pull_request:

jobs:
  lyrical-build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:resolute
    env:
      ROS_LOCALHOST_ONLY: "1"
      ROS_LOG_DIR: /tmp/universal_gnss_ros_log_lyrical

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Lyrical
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: lyrical

      - name: Build and test universal_gnss_ros2 on Lyrical
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/lyrical/setup.bash
          set -u
          mkdir -p "$ROS_LOG_DIR"
          mkdir -p "$GITHUB_WORKSPACE/ros2_ws_lyrical/src"
          ln -s "$GITHUB_WORKSPACE/gnss_ros2" "$GITHUB_WORKSPACE/ros2_ws_lyrical/src/gnss_ros2"
          ln -s "$GITHUB_WORKSPACE/gnss_core" "$GITHUB_WORKSPACE/ros2_ws_lyrical/src/gnss_core"
          cd "$GITHUB_WORKSPACE/ros2_ws_lyrical"
          colcon build --packages-select universal_gnss_ros2
          if ! colcon test --packages-select universal_gnss_ros2; then
            colcon test-result --verbose
            exit 1
          fi
          colcon test-result --verbose
