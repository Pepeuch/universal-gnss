name: ROS 2 Lyrical validation

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lyrical-build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base
    env:
      ROS_LOCALHOST_ONLY: "1"
      ROS_LOG_DIR: /tmp/universal_gnss_ros_log_lyrical

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up ROS 2 Lyrical
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/lyrical/setup.bash
          test "$ROS_DISTRO" = lyrical
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev python3-colcon-common-extensions \
            ros-${ROS_DISTRO}-ament-cmake-gtest \
            ros-${ROS_DISTRO}-ament-cmake-pytest \
            ros-${ROS_DISTRO}-builtin-interfaces \
            ros-${ROS_DISTRO}-diagnostic-msgs \
            ros-${ROS_DISTRO}-launch \
            ros-${ROS_DISTRO}-launch-ros \
            ros-${ROS_DISTRO}-rclcpp \
            ros-${ROS_DISTRO}-rclpy \
            ros-${ROS_DISTRO}-rosidl-default-generators \
            ros-${ROS_DISTRO}-rosidl-default-runtime \
            ros-${ROS_DISTRO}-sensor-msgs \
            ros-${ROS_DISTRO}-std-srvs
          rm -rf /var/lib/apt/lists/*
          python3 - <<'PYTHON'
          from ament_index_python.packages import get_packages_with_prefixes
          names = get_packages_with_prefixes()
          assert not any(name.startswith('universal_gnss') for name in names), 'preinstalled Universal GNSS overlay'
          PYTHON

      - name: Prepare normal project build user
        run: |
          groupadd --gid 1001 universal-gnss-ci
          useradd --create-home --uid 1001 --gid 1001 universal-gnss-ci
          install --directory --owner=1001 --group=1001 "$ROS_LOG_DIR"
          chown -R 1001:1001 "$GITHUB_WORKSPACE"

      - name: Build and test universal_gnss_ros2 on Lyrical
        shell: bash
        run: |
          runuser -u universal-gnss-ci -- env \
            HOME=/home/universal-gnss-ci \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            ROS_LOG_DIR="$ROS_LOG_DIR" \
            bash -lc '
              set -eo pipefail
              source /opt/ros/lyrical/setup.bash
              rm -rf "$GITHUB_WORKSPACE/ros2_ws_lyrical/src"
              mkdir -p "$GITHUB_WORKSPACE/ros2_ws_lyrical/src"
              ln -s "$GITHUB_WORKSPACE/universal_gnss_msgs" "$GITHUB_WORKSPACE/ros2_ws_lyrical/src/universal_gnss_msgs"
              ln -s "$GITHUB_WORKSPACE/adapters/ros2/gnss_ros2" "$GITHUB_WORKSPACE/ros2_ws_lyrical/src/gnss_ros2"
              ln -s "$GITHUB_WORKSPACE/core/gnss_core" "$GITHUB_WORKSPACE/ros2_ws_lyrical/src/gnss_core"
              cd "$GITHUB_WORKSPACE/ros2_ws_lyrical"
              colcon build --packages-select universal_gnss_msgs
              colcon test --packages-select universal_gnss_msgs
              colcon test-result --verbose
              source install/setup.bash
              test -z "$(ros2 pkg executables universal_gnss_msgs)"
              colcon build --packages-select universal_gnss_ros2
              if ! colcon test --packages-select universal_gnss_ros2; then
                colcon test-result --verbose
                exit 1
              fi
              colcon test-result --verbose
            '
