name: Docker multi-architecture release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tag to GHCR (the ref must be a v* tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-release-index:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [kilted, lyrical]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve immutable release identity
        id: identity
        shell: bash
        env:
          REQUESTED_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_PUBLISH}" == "true" && "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Publishing requires a v* tag ref" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="ci-${GITHUB_SHA}"
          fi
          repository="${GITHUB_REPOSITORY,,}"
          echo "created=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${repository}-ros2-${{ matrix.ros_distro }}" >> "${GITHUB_OUTPUT}"
          echo "publish=${REQUESTED_PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.identity.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-architecture image and release attestations
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.identity.outputs.publish == 'true' }}
          tags: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.identity.outputs.created }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.ros_distro }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.ros_distro }}

      - name: Verify published image index platforms
        if: steps.identity.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          inspection="$(docker buildx imagetools inspect \
            "${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}")"
          grep -F 'Platform:    linux/amd64' <<< "${inspection}"
          grep -F 'Platform:    linux/arm64' <<< "${inspection}"
          test -n "${{ steps.build.outputs.digest }}"
